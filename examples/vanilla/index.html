<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis · Operations dashboard (vanilla)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo" aria-hidden="true"></span>Northwind <em>Ops</em></div>
      <nav class="actions">
        <button data-action="add-chart">＋ Chart</button>
        <button data-action="add-log">＋ Log</button>
        <div class="menu-wrap">
          <button data-action="hidden" aria-haspopup="menu">Hidden <span class="count">0</span></button>
          <div class="menu" role="menu" hidden></div>
        </div>
        <select data-action="theme" aria-label="Theme">
          <option value="light">Light</option>
          <option value="medium">Medium</option>
          <option value="dark">Dark</option>
          <option value="darker">Darker</option>
        </select>
        <button data-action="reset">Reset layout</button>
        <a class="alt" href="./element.html">Custom element version →</a>
      </nav>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
