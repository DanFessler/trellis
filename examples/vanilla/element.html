<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis · &lt;trellis-workspace&gt;</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { display: flex; flex-direction: column; background: #0c0d0f; color: #e7e8eb; }
      header { padding: 10px 16px; font-size: 13px; display: flex; gap: 16px; align-items: center; }
      header a { color: #8fb0ff; }
      trellis-workspace { flex: 1; min-height: 0; }
      .pad { padding: 14px 16px; font-size: 13px; line-height: 1.6; }
      .pad textarea { width: 100%; height: 140px; box-sizing: border-box; background: rgba(255,255,255,.04); color: inherit; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 10px; font: inherit; }
      .welcome { text-align: center; color: #8b8e98; font-size: 13px; }
      .welcome button { margin-top: 8px; background: #5b8cff; color: white; border: 0; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <header>
      <strong>&lt;trellis-workspace&gt;</strong>
      <span>Declared entirely in HTML: view types are &lt;template&gt;s, the layout is markup.</span>
      <a href="./index.html">← Vanilla JS version</a>
    </header>
    <trellis-workspace theme="dark" storage-key="trellis-element-demo" version="1">
      <template data-view-type="readme" data-title="Read me" data-placement="stage" data-allow-side="false">
        <div class="pad">
          <h2 style="margin-top:0">Hello from HTML</h2>
          <p>Drag this tab around. Type in the notes panel, then dock it somewhere else — the text stays.</p>
          <p>Document: <strong data-param="name"></strong></p>
        </div>
      </template>
      <template data-view-type="notes" data-title="Notes" data-singleton>
        <div class="pad"><textarea placeholder="Type something, then move this panel…"></textarea></div>
      </template>
      <template data-view-type="web" data-title="example.com" data-iframe="https://example.com"></template>
      <trellis-split weights="1 3">
        <trellis-view type="notes"></trellis-view>
        <trellis-stage>
          <trellis-panel>
            <trellis-view type="readme" params='{"name":"index.html"}'></trellis-view>
            <trellis-view type="web"></trellis-view>
          </trellis-panel>
        </trellis-stage>
      </trellis-split>
      <div slot="stage-empty" class="welcome">
        Nothing open.<br /><button type="button" id="reopen">Open “Read me”</button>
      </div>
    </trellis-workspace>
    <script type="module" src="/src/element.ts"></script>
  </body>
</html>
