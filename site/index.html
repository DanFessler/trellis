<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis · Fractal, dockable workspaces for web tools</title>
    <meta
      name="description"
      content="Trellis is a layout library for web apps where panels nest inside panels as deep as users like, and the view zooms to whichever part they need. Content stays mounted through every move."
    />
    <meta name="theme-color" content="#0a0b0a" />
    <meta property="og:title" content="Trellis · Fractal, dockable workspaces for web tools" />
    <meta
      property="og:description"
      content="Fractal layouts for web apps. Nest panels to any depth, zoom to the part you need, and keep every view alive. For React, web components or plain DOM."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trellisui.com/" />
    <meta property="og:image" content="https://trellisui.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Trellis: fractal layouts for web apps" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://trellisui.com/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("trellis-site-theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
